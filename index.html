<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS距離検証 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--plate:#F5C518;--paper:#FFF;--field:#F2F2F0;
  --line:#D8D8D4;--grey:#6B6B6B;--ng:#C62222;--ok:#12794A}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--black);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:40px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

header{background:var(--black);color:var(--plate);padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top,0))}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em}
header p{margin:4px 0 0;font-size:11px;color:#9A9A96}
main{padding:14px;max-width:640px;margin:0 auto}

.sec{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--grey);
  margin:24px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--black)}
.card{background:var(--paper);border:1px solid var(--line);padding:14px;margin-bottom:9px}
.hint{font-size:12px;color:var(--grey);line-height:1.7;margin-top:6px}

.live{background:var(--black);color:#9A9A96;padding:16px;margin-bottom:12px}
.live .big{font-family:"Oswald",sans-serif;font-size:44px;line-height:1.1;
  letter-spacing:.02em;color:var(--plate)}
.live .big small{font-size:16px;font-family:inherit;font-weight:400;color:#9A9A96}
.live .sub{font-size:12px;margin-top:6px;line-height:1.7}
.live .warn{color:#FFB4B4;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--paper);border:1px solid var(--line);padding:10px 12px}
.stat .k{font-size:11px;color:var(--grey)}
.stat .v{font-family:"Oswald",sans-serif;font-size:21px;line-height:1.2}
.stat .v small{font-size:12px;font-family:inherit;font-weight:400;color:var(--grey)}
.stat.bad{border-color:var(--ng)}
.stat.bad .v{color:var(--ng)}

table{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper)}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--grey);font-weight:500}
td.n{font-family:"Oswald",sans-serif;font-size:16px;text-align:right;letter-spacing:.02em}
tr.best td{background:#FFFBEB}
tr.best td:first-child::after{content:"　最良";font-size:10px;color:var(--grey);font-family:inherit}

.act{display:block;width:100%;padding:16px;margin-top:10px;border:2px solid var(--black);
  background:var(--paper);font-size:16px;font-weight:700;text-align:center}
.act.dark{background:var(--black);color:var(--plate)}
.act.ng{border-color:var(--ng);color:var(--ng)}
.act:disabled{opacity:.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .act{margin-top:0}

.field-lbl{font-size:12px;color:var(--grey);margin:14px 0 4px}
.num{width:100%;padding:14px 12px;border:2px solid var(--black);border-radius:2px;
  background:var(--paper);font-family:"Oswald",sans-serif;font-size:26px;
  letter-spacing:.04em;text-align:center}
.txt{width:100%;padding:12px;border:2px solid var(--line);border-radius:2px;
  background:var(--paper);font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--paper);padding:7px 12px;font-size:13px}
.chip.on{background:var(--black);color:var(--plate);border-color:var(--black)}

.run{background:var(--paper);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.run .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.run .h b{font-size:14px}
.run .h span{font-family:"Oswald",sans-serif;font-size:17px}
.run .d{font-size:12px;color:var(--grey);margin-top:5px;line-height:1.7}
.ok{color:var(--ok);font-weight:700}
.ng{color:var(--ng);font-weight:700}
.empty{padding:30px 16px;text-align:center;color:var(--grey);font-size:14px;
  background:var(--paper);border:1px dashed var(--line)}
.hide{display:none!important}
</style>
</head>
<body>

<header>
  <h1>GPS距離検証 v2</h1>
  <p>トリップメーター基準。標準フィルタが ±2% に収まるかを 3〜5 本で確認する</p>
</header>

<main>
  <div id="liveWrap"></div>
  <div id="body"></div>

  <div class="sec">これまでの走行</div>
  <div id="runs"></div>
  <button class="act" id="btnCsvAll">全走行のまとめを書き出す（CSV）</button>
  <p class="hint" id="note"></p>
</main>

<script>
/* ============================================================
   GPS距離検証 v2

   v1 からの変更点
   1. 基準をトリップメーター（0.1km）にした
      オドメーターは 1km 単位のため、正解値自体が ±0.5km（±2.9%）の
      幅を持ち、標準・厳格・速度積分の差が基準の分解能に埋もれていた。
   2. 走行を複数本ためて比較できるようにした
      1 本では判断できない。3〜5 本で標準フィルタが安定して
      ±2% に入るかを見る。
   3. 保存を毎回行うようにした
      v1 は測位 10 件ごとの保存で、開始直後にリロードすると消えた。
   4. 区間の性質（高架下・ビル街・地下）を記録できるようにした
      悪条件でどれだけ崩れるかが本来の関心事のため。
   ============================================================ */

const F = {
  raw:      {label:'生データ',   acc:Infinity, min:0},
  standard: {label:'標準',       acc:30,       min:8},
  strict:   {label:'厳格',       acc:15,       min:15}
};
const CHUNK = 400;          // 生データはこの件数ごとに保存する
const SAVE_MS = 2000;       // 集計はこの間隔で保存する
const CONDITIONS = ['高架下','ビル街','地下・屋内','幹線道路','住宅街','雨天','夜間'];

let S = null;               // 走行中の状態
let runs = [];              // 完了した走行
let buf = [];               // 未保存の生データ
let lastSave = 0;
let wakeLock = null;

const LS = k => 'gps2:' + k;
const g = k => { try{ const v=localStorage.getItem(LS(k)); return v==null?null:JSON.parse(v); }catch(e){ return null; } };
const s = (k,v) => { try{ v===null ? localStorage.removeItem(LS(k)) : localStorage.setItem(LS(k), JSON.stringify(v)); return true; }catch(e){ return false; } };
const hhmm = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const pct = (a,b) => b ? ((a-b)/b*100) : 0;
const f1 = n => (Math.round(n*10)/10).toFixed(1);
const f2 = n => (Math.round(n*100)/100).toFixed(2);

function distM(a,b){
  const R=6371000, t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  const la=a.lat*t, lb=b.lat*t;
  const x=Math.sin(dLat/2)**2 + Math.cos(la)*Math.cos(lb)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* ── 走行の開始・終了 ───────────────── */

function blank(tripStart, cond){
  return {
    id:'r'+Date.now().toString(36),
    startedAt:Date.now(), endedAt:null,
    tripStart:tripStart, tripEnd:null, cond:cond||[],
    m:{raw:0, standard:0, strict:0}, speedM:0,
    n:0, dropped:{acc:0, jump:0, gap:0},
    accSum:0, maxGap:0, bg:0, wake:false,
    lastFixAt:null, chunks:0
  };
}

async function start(){
  const v = parseFloat(document.getElementById('tripStart').value);
  if(isNaN(v)){ alert('開始時のトリップメーター値を入れてください'); return; }
  if(!navigator.geolocation){ alert('この端末では位置情報が使えません'); return; }
  const cond = [...document.querySelectorAll('.chip.on')].map(c=>c.dataset.c);
  S = blank(v, cond);
  buf = [];
  s('cur', S); s('buf:0', []);
  await lock();
  watch();
  render();
}

let watchId = null, last = null;
function watch(){
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onFix,
    e=>{ /* 失敗は記録しない。次の測位を待つ */ },
    {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}

function onFix(p){
  if(!S) return;
  const now = {
    lat:p.coords.latitude, lng:p.coords.longitude,
    acc:p.coords.accuracy,
    spd:(p.coords.speed==null||isNaN(p.coords.speed)) ? null : p.coords.speed, // m/s
    t:p.timestamp || Date.now()
  };
  S.n++; S.accSum += now.acc;
  if(S.lastFixAt){
    const gap = (now.t - S.lastFixAt)/1000;
    if(gap > S.maxGap) S.maxGap = gap;
  }
  S.lastFixAt = now.t;

  let seg = 0;
  if(last){
    const dt = (now.t - last.t)/1000;
    seg = distM(last, now);
    if(dt > 0 && dt <= 120){
      /* 明らかな飛びは全方式で捨てる（時速 200km 超） */
      if(seg/dt > 55){ S.dropped.jump++; seg = 0; }
      else {
        for(const k of Object.keys(F)){
          const f = F[k];
          if(now.acc > f.acc){ if(k==='standard') S.dropped.acc++; continue; }
          if(seg < f.min) continue;
          S.m[k] += seg;
        }
        /* 速度積分は端末の速度センサ値を使う */
        if(now.spd!=null && now.spd >= 0) S.speedM += now.spd * dt;
      }
    } else if(dt > 120){ S.dropped.gap++; seg = 0; }
  }
  last = now;

  buf.push([new Date(now.t).toISOString(), now.lat.toFixed(6), now.lng.toFixed(6),
            Math.round(now.acc), now.spd==null?'':f1(now.spd*3.6), Math.round(seg*10)/10]);
  if(buf.length >= CHUNK) flush();
  if(Date.now() - lastSave > SAVE_MS){ s('cur', S); lastSave = Date.now(); }
  renderLive();
}

function flush(){
  if(!S || !buf.length) return;
  if(s('buf:'+S.chunks, buf)){ S.chunks++; buf = []; s('cur', S); }
}

async function lock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      if(S) S.wake = true;
      wakeLock.addEventListener('release', ()=>{ if(S) S.wake=false; renderLive(); });
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState === 'hidden'){ if(S){ S.bg++; flush(); s('cur',S); } }
  else if(S){ await lock(); watch(); }
  renderLive();
});

function finish(){
  const v = parseFloat(document.getElementById('tripEnd').value);
  if(isNaN(v)){ alert('終了時のトリップメーター値を入れてください'); return; }
  if(v < S.tripStart){ alert('開始時より小さい値は入れられません'); return; }
  flush();
  S.tripEnd = v; S.endedAt = Date.now();
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; }
  runs.push(S); s('runs', runs);
  /* 生データは走行ごとに退避して、次の走行と混ざらないようにする */
  for(let i=0;i<S.chunks;i++){ s(`raw:${S.id}:${i}`, g('buf:'+i)); s('buf:'+i, null); }
  s(`rawn:${S.id}`, S.chunks);
  S = null; last = null; buf = [];
  s('cur', null);
  render();
}

function abort(){
  if(!confirm('この走行を破棄します。よろしいですか。')) return;
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; }
  for(let i=0;i<(S?S.chunks:0);i++) s('buf:'+i, null);
  S=null; last=null; buf=[]; s('cur', null); render();
}

/* ── 集計 ───────────────────────── */

function results(r){
  const base = r.tripEnd - r.tripStart;
  const out = [];
  for(const k of Object.keys(F)) out.push({key:k, label:F[k].label, km:r.m[k]/1000});
  out.push({key:'speed', label:'速度積分', km:r.speedM/1000});
  out.forEach(o=>{ o.diff = o.km - base; o.pct = pct(o.km, base); });
  return {base, rows:out};
}
function bestKey(rows){
  let b=null;
  rows.forEach(o=>{ if(!b || Math.abs(o.pct) < Math.abs(b.pct)) b=o; });
  return b ? b.key : null;
}

/* ── 画面 ───────────────────────── */

function renderLive(){
  const w = document.getElementById('liveWrap');
  if(!S){ w.innerHTML=''; return; }
  const min = Math.round((Date.now()-S.startedAt)/60000);
  const km = S.m.standard/1000;
  const avgAcc = S.n ? Math.round(S.accSum/S.n) : 0;
  const gapBad = S.maxGap > 30;
  w.innerHTML = `
    <div class="live">
      <div class="big">${f2(km)}<small> km（標準フィルタ）</small></div>
      <div class="sub">
        経過 ${min}分　測位 ${S.n}件　平均精度 ${avgAcc}m<br>
        生 ${f2(S.m.raw/1000)}km ／ 厳格 ${f2(S.m.strict/1000)}km ／ 速度積分 ${f2(S.speedM/1000)}km
        ${S.wake?'':'<br><span class="warn">画面ロック防止が効いていません</span>'}
        ${S.bg?`<br><span class="warn">背景に回った回数 ${S.bg}（この間の測位は止まります）</span>`:''}
      </div>
    </div>
    <div class="grid">
      <div class="stat${gapBad?' bad':''}"><div class="k">最大測位間隔</div>
        <div class="v">${f1(S.maxGap)}<small> 秒</small></div></div>
      <div class="stat"><div class="k">除外（精度）</div>
        <div class="v">${S.dropped.acc}<small> 件</small></div></div>
      <div class="stat"><div class="k">除外（飛び）</div>
        <div class="v">${S.dropped.jump}<small> 件</small></div></div>
      <div class="stat"><div class="k">除外（間隔）</div>
        <div class="v">${S.dropped.gap}<small> 件</small></div></div>
    </div>`;
}

function render(){
  renderLive();
  const b = document.getElementById('body');

  if(!S){
    b.innerHTML = `
      <div class="sec">新しい走行を始める</div>
      <div class="card">
        <p class="hint" style="margin-top:0">
          <b>先にトリップメーターをリセットしてください。</b>
          0.1km 単位で読めるため、オドメーター（1km 単位）より正確に比べられます。
          リセットせずに使う場合は、いまの表示値をそのまま入れてください。</p>
        <div class="field-lbl">開始時のトリップメーター（km）</div>
        <input class="num" id="tripStart" type="text" inputmode="decimal" value="0.0">
        <div class="field-lbl">この区間の性質（あてはまるもの全部）</div>
        <div class="chips" id="chips">
          ${CONDITIONS.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')}
        </div>
        <button class="act dark" id="btnStart">計測を開始する</button>
        <p class="hint">開始したら画面を消さないでください。Android の Chrome は画面が消えると測位を止めます。</p>
      </div>`;
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
    document.getElementById('btnStart').onclick = start;
  } else {
    b.innerHTML = `
      <div class="sec">計測中</div>
      <div class="card">
        <div class="field-lbl">終了時のトリップメーター（km）</div>
        <input class="num" id="tripEnd" type="text" inputmode="decimal" placeholder="0.0">
        <button class="act dark" id="btnFinish">この走行を終える</button>
        <button class="act ng" id="btnAbort">破棄する</button>
        <p class="hint">開始 ${hhmm(S.startedAt)}　基準 ${f1(S.tripStart)}km から
          ${S.cond.length?`／ ${S.cond.join('・')}`:''}</p>
      </div>`;
    document.getElementById('btnFinish').onclick = finish;
    document.getElementById('btnAbort').onclick = abort;
  }

  renderRuns();
  document.getElementById('note').textContent =
    `保存先はこの端末のみです。サーバには送りません。走行 ${runs.length} 本を保持しています。`;
}

function renderRuns(){
  const w = document.getElementById('runs');
  if(!runs.length){ w.innerHTML = `<div class="empty">まだ走行がありません。3〜5 本ためて判断します。</div>`; return; }

  /* まとめ：方式ごとに全走行の誤差率を並べる */
  const agg = {};
  runs.forEach(r=>{
    const res = results(r);
    res.rows.forEach(o=>{ (agg[o.key] = agg[o.key] || {label:o.label, list:[]}).list.push(o.pct); });
  });
  const sumRows = Object.keys(agg).map(k=>{
    const l = agg[k].list;
    const mean = l.reduce((a,b)=>a+b,0)/l.length;
    const worst = l.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a, 0);
    const within = l.filter(x=>Math.abs(x)<=2).length;
    return {key:k, label:agg[k].label, mean, worst, within, n:l.length};
  });
  let best=null; sumRows.forEach(o=>{ if(!best || Math.abs(o.mean)<Math.abs(best.mean)) best=o; });

  w.innerHTML = `
    <table>
      <tr><th>方式</th><th style="text-align:right">平均誤差</th>
          <th style="text-align:right">最悪</th><th style="text-align:right">±2%内</th></tr>
      ${sumRows.map(o=>`
        <tr class="${best&&o.key===best.key?'best':''}">
          <td>${o.label}</td>
          <td class="n">${o.mean>0?'+':''}${f1(o.mean)}%</td>
          <td class="n">${o.worst>0?'+':''}${f1(o.worst)}%</td>
          <td class="n">${o.within}/${o.n}</td></tr>`).join('')}
    </table>
    <p class="hint">「±2%内」が 3 本以上すべてで満たされれば、その方式を採用してよい。
      1 本でも外れるなら本数を増やす。</p>` +
    runs.slice().reverse().map(r=>{
      const res = results(r);
      const std = res.rows.find(o=>o.key==='standard');
      const min = Math.round((r.endedAt-r.startedAt)/60000);
      const ok = Math.abs(std.pct) <= 2;
      return `<div class="run">
        <div class="h"><b>${new Date(r.startedAt).toLocaleDateString('ja-JP')} ${hhmm(r.startedAt)}</b>
          <span class="${ok?'ok':'ng'}">${std.pct>0?'+':''}${f1(std.pct)}%</span></div>
        <div class="d">
          基準 ${f1(res.base)}km（トリップ ${f1(r.tripStart)}→${f1(r.tripEnd)}）　${min}分　測位 ${r.n}件<br>
          ${res.rows.map(o=>`${o.label} ${f2(o.km)}km`).join(' ／ ')}<br>
          最大間隔 ${f1(r.maxGap)}秒　背景 ${r.bg}回${r.cond.length?`　${r.cond.join('・')}`:''}
        </div>
        <div class="row2" style="margin-top:10px">
          <button class="act" data-csv="${r.id}" style="padding:9px;font-size:13px;font-weight:400">生データCSV</button>
          <button class="act ng" data-del="${r.id}" style="padding:9px;font-size:13px;font-weight:400">削除</button>
        </div>
      </div>`;
    }).join('');

  w.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>csvRaw(b.dataset.csv));
  w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('この走行を削除します。よろしいですか。')) return;
    const id=b.dataset.del, n=g(`rawn:${id}`)||0;
    for(let i=0;i<n;i++) s(`raw:${id}:${i}`, null);
    s(`rawn:${id}`, null);
    runs = runs.filter(r=>r.id!==id); s('runs', runs); render();
  });
}

/* ── 書き出し ───────────────────── */

function dl(name, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click();
}
function csvRaw(id){
  const n = g(`rawn:${id}`)||0;
  let rows = [['time_iso','lat','lon','accuracy_m','speed_kmh','seg_m'].join(',')];
  for(let i=0;i<n;i++){
    const c = g(`raw:${id}:${i}`) || [];
    c.forEach(r=>rows.push(r.join(',')));
  }
  if(rows.length===1){ alert('生データが見つかりません'); return; }
  dl(`gps_raw_${id}.csv`, rows.join('\n'));
}
document.getElementById('btnCsvAll').onclick = ()=>{
  if(!runs.length){ alert('走行がありません'); return; }
  const head = ['開始','終了','分','区間の性質','基準km','生km','標準km','厳格km','速度積分km',
                '生%','標準%','厳格%','速度積分%','測位件数','平均精度m','最大間隔秒','背景回数',
                '除外精度','除外飛び','除外間隔'];
  const lines = [head.join(',')];
  runs.forEach(r=>{
    const res = results(r);
    const v = k => res.rows.find(o=>o.key===k);
    lines.push([
      new Date(r.startedAt).toISOString(), new Date(r.endedAt).toISOString(),
      Math.round((r.endedAt-r.startedAt)/60000), `"${r.cond.join('・')}"`,
      f1(res.base), f2(v('raw').km), f2(v('standard').km), f2(v('strict').km), f2(v('speed').km),
      f1(v('raw').pct), f1(v('standard').pct), f1(v('strict').pct), f1(v('speed').pct),
      r.n, r.n?Math.round(r.accSum/r.n):0, f1(r.maxGap), r.bg,
      r.dropped.acc, r.dropped.jump, r.dropped.gap
    ].join(','));
  });
  dl('gps_summary.csv', lines.join('\n'));
};

/* ── 起動 ───────────────────────── */

(async function boot(){
  runs = g('runs') || [];
  const cur = g('cur');
  if(cur && !cur.endedAt){
    /* 中断していた計測を引き継ぐ（リロードで消えないようにするため） */
    S = cur;
    buf = g('buf:'+cur.chunks) || [];
    await lock(); watch();
  }
  render();
  setInterval(()=>{ if(S) renderLive(); }, 5000);
})();
</script>
